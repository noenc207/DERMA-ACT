# ============================================================
# DERMA-ACT V2 — Trustworthy Skin Cancer AI (pyproject.toml)
# Python 3.11+ | PEP 517/518 configuration
# ============================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ────────────────────────────────────────────────────────────
# Project Metadata
# ────────────────────────────────────────────────────────────
[project]
name            = "derma-act-v2"
version         = "0.2.0"
description     = "Research framework for seven-class dermoscopic image classification and event-aware sequential image-view policy evaluation"
readme          = "README.md"
# No repository-wide open-source license has been established yet. See LICENSE_STATUS.md.
license         = { text = "No repository-wide open-source license has been established — see LICENSE_STATUS.md" }
requires-python = ">=3.11"
authors         = [{ name = "Duc-Son Le", email = "SonldQE220036@fpt.edu.vn" }]
keywords        = [
    "dermoscopy",
    "skin-lesion-classification",
    "active-perception",
    "conformal-prediction",
    "uncertainty-quantification",
    "decision-stability",
    "isic-2019",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Repository and persistent archive URLs remain pending verified public release.
[project.urls]

[project.scripts]
skin-ai = "src.cli:main"

# ────────────────────────────────────────────────────────────
# Setuptools — Package Discovery
# ────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "research*"]

# ────────────────────────────────────────────────────────────
# Ruff — Linting & Formatting (replaces flake8 + isort + pyupgrade)
# ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src", "tests"]
exclude        = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.pyi",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ────────────────────────────────────────────────────────────
# Black — Code Formatter
# ────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py311"]
include        = '\.pyi?$'

# ────────────────────────────────────────────────────────────
# isort — Import Sorting
# ────────────────────────────────────────────────────────────
[tool.isort]
profile             = "black"
line_length         = 100
known_first_party   = ["src", "research"]
skip_glob           = ["*.pyi"]

# ────────────────────────────────────────────────────────────
# MyPy — Static Type Checking
# ────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
warn_return_any        = true
warn_unused_configs    = true
disallow_untyped_defs  = true
plugins                = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "albumentations.*",
    "torch.*",
    "torchvision.*",
    "lightning.*",
    "mlflow.*",
    "wandb.*",
    "hydra.*",
    "omegaconf.*",
    "sklearn.*",
    "onnxruntime.*",
    "gradcam.*",
]
ignore_missing_imports = true

# ────────────────────────────────────────────────────────────
# Pytest — Test Configuration
# ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts       = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require services)",
    "api: API endpoint tests (requires running server)",
    "model: Model inference and training tests (requires GPU or model weights)",
    "slow: Tests that are expected to take a long time",
    "REAL_VLM_INTEGRATION: Tests that require a real VLM model to be available locally",
]

# ────────────────────────────────────────────────────────────
# Coverage
# ────────────────────────────────────────────────────────────
[tool.coverage.run]
source        = ["src"]
omit          = ["*/tests/*", "*/migrations/*", "*/alembic/*"]
branch        = true

[tool.coverage.report]
show_missing  = true
skip_covered  = false
precision     = 2
fail_under    = 70
